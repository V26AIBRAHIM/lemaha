<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الزيارات</title>
<script>try{var t=localStorage.getItem("planner-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fb;--card:#fff;--ink:#1f2340;--mut:#69708f;--acc:#4f46e5;--acc-ink:#fff;--bd:#dfe2f2;--head:#eceefb;--row:#f8f9fe;color-scheme:light;box-sizing:border-box}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c33;--ink:#eaecff;--mut:#9aa1c7;--acc:#8b87ff;--acc-ink:#0f1220;--bd:#2a3058;--head:#20254a;--row:#1c2140;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;line-height:1.7}
main{max-width:820px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{margin:0;font-size:1.6rem;font-weight:800}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd);padding:6px 14px;font-weight:600}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:center;color:var(--mut)}
.stat b{display:block;font-size:2.2rem;line-height:1.2;color:var(--acc)}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:right;white-space:nowrap}
th{background:var(--head);font-weight:800}
tbody tr:nth-child(even){background:var(--row)}
td{border-top:1px solid var(--bd)}
#msg{margin:12px 0;font-weight:600;color:var(--mut)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="bar"><h1>لوحة الزيارات</h1><button class="ghost" id="theme">🌙 دارك</button></div>
<div class="actions"><button id="login">دخول بحساب Google</button><button class="ghost" id="logout" hidden>خروج</button></div>
<div id="msg"></div>
<div class="stats" id="stats" hidden>
  <div class="stat"><b id="total">0</b>إجمالي الزيارات</div>
  <div class="stat"><b id="people">0</b>عدد الأشخاص (من آخر 500 زيارة)</div>
</div>
<div class="wrap"><table id="tbl" hidden><thead><tr><th>الاسم</th><th>الوقت</th><th>الجهاز</th></tr></thead><tbody></tbody></table></div>
</main>
<script>
(function(){
  var b=document.getElementById("theme");
  function apply(t){document.documentElement.setAttribute("data-theme",t);b.textContent=t==="dark"?"☀️ لايت":"🌙 دارك"}
  var th="light";try{th=localStorage.getItem("planner-theme")||"light"}catch(e){}
  apply(th);
  b.onclick=function(){th=th==="dark"?"light":"dark";apply(th);try{localStorage.setItem("planner-theme",th)}catch(e){}};
})();
</script>
<script type="module">
/* الصق نفس بيانات Firebase اللي في lemaha.html */
const cfg={apiKey:"AIzaSyCkrNCigjNickuG-NMcOIfE1hoXlON9lA4",authDomain:"lemaha-7a942.firebaseapp.com",projectId:"lemaha-7a942",appId:"1:990938711587:web:331b4b40d38ebf59d11396"};
const $=id=>document.getElementById(id);
if(cfg.apiKey.startsWith("PASTE")){
  $("msg").textContent="الصق بيانات Firebase في أول السكريبت الأول.";
}else{
  const V="https://www.gstatic.com/firebasejs/10.12.2/";
  const {initializeApp}=await import(V+"firebase-app.js");
  const {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=await import(V+"firebase-auth.js");
  const {getFirestore,collection,query,orderBy,limit,getDocs,getCountFromServer}=await import(V+"firebase-firestore.js");
  const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
  $("login").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{$("msg").textContent="تعذر تسجيل الدخول: "+e.code});
  $("logout").onclick=()=>signOut(auth);
  onAuthStateChanged(auth,async user=>{
    $("login").hidden=!!user;$("logout").hidden=!user;
    $("stats").hidden=$("tbl").hidden=true;
    if(!user){$("msg").textContent="سجّل دخول بحساب صاحب الموقع.";return}
    $("msg").textContent="جاري التحميل...";
    try{
      const col=collection(db,"visits");
      const [snap,cnt]=await Promise.all([getDocs(query(col,orderBy("at","desc"),limit(500))),getCountFromServer(col)]);
      const body=document.querySelector("#tbl tbody");body.textContent="";
      const names=new Set();
      snap.forEach(d=>{
        const v=d.data();names.add((v.name||"").trim().toLowerCase());
        const tr=document.createElement("tr");
        const t=v.at&&v.at.toDate?v.at.toDate().toLocaleString("ar-EG"):"";
        const dev=/Mobile|Android|iPhone/i.test(v.ua||"")?"موبايل":"كمبيوتر";
        [v.name||"",t,dev].forEach(x=>{const td=document.createElement("td");td.textContent=x;tr.appendChild(td)});
        body.appendChild(tr);
      });
      $("total").textContent=cnt.data().count;$("people").textContent=names.size;
      $("stats").hidden=$("tbl").hidden=false;$("msg").textContent="";
    }catch(e){$("msg").textContent="الحساب ده مش مسموح له يشوف البيانات ("+e.code+")."}
  });
}
</script>
</body>
</html>
