<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الزيارات</title>
<style>
body{margin:0;background:#fff0f6;color:#66334d;font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{color:#d85f98;text-align:center}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#f08ab6;color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stat{background:#fffafd;border:1px solid #f5cadd;border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:2rem;color:#d85f98}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fffafd;border:1px solid #f5cadd}
th,td{padding:8px 10px;border-bottom:1px solid #f5cadd;text-align:right}
th{background:#ffe3ef}
#msg{margin:12px 0;font-weight:600}
</style>
</head>
<body>
<main>
<h1>لوحة الزيارات</h1>
<div style="text-align:center"><button id="login">دخول بحساب Google</button> <button id="logout" hidden>خروج</button></div>
<div id="msg"></div>
<div class="stats" id="stats" hidden>
  <div class="stat"><b id="total">0</b>إجمالي الزيارات</div>
  <div class="stat"><b id="people">0</b>عدد الأشخاص (من آخر 500 زيارة)</div>
</div>
<div class="wrap"><table id="tbl" hidden><thead><tr><th>الاسم</th><th>الوقت</th><th>الجهاز</th></tr></thead><tbody></tbody></table></div>
</main>
<script type="module">
/* الصق نفس بيانات Firebase اللي في lemaha.html */
const cfg={apiKey:"AIzaSyCkrNCigjNickuG-NMcOIfE1hoXlON9lA4",authDomain:"lemaha-7a942.firebaseapp.com",projectId:"lemaha-7a942",appId:"1:990938711587:web:331b4b40d38ebf59d11396"};
const $=id=>document.getElementById(id);
if(cfg.apiKey.startsWith("PASTE")){
  $("msg").textContent="الصق بيانات Firebase في أول السكريبت الأول.";
}else{
  const V="https://www.gstatic.com/firebasejs/10.12.2/";
  const {initializeApp}=await import(V+"firebase-app.js");
  const {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=await import(V+"firebase-auth.js");
  const {getFirestore,collection,query,orderBy,limit,getDocs,getCountFromServer}=await import(V+"firebase-firestore.js");
  const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
  $("login").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{$("msg").textContent="تعذر تسجيل الدخول: "+e.code});
  $("logout").onclick=()=>signOut(auth);
  onAuthStateChanged(auth,async user=>{
    $("login").hidden=!!user;$("logout").hidden=!user;
    $("stats").hidden=$("tbl").hidden=true;
    if(!user){$("msg").textContent="سجّل دخول بحساب صاحب الموقع.";return}
    $("msg").textContent="جاري التحميل...";
    try{
      const col=collection(db,"visits");
      const [snap,cnt]=await Promise.all([getDocs(query(col,orderBy("at","desc"),limit(500))),getCountFromServer(col)]);
      const body=document.querySelector("#tbl tbody");body.textContent="";
      const names=new Set();
      snap.forEach(d=>{
        const v=d.data();names.add((v.name||"").trim().toLowerCase());
        const tr=document.createElement("tr");
        const t=v.at&&v.at.toDate?v.at.toDate().toLocaleString("ar-EG"):"";
        const dev=/Mobile|Android|iPhone/i.test(v.ua||"")?"موبايل":"كمبيوتر";
        [v.name||"",t,dev].forEach(x=>{const td=document.createElement("td");td.textContent=x;tr.appendChild(td)});
        body.appendChild(tr);
      });
      $("total").textContent=cnt.data().count;$("people").textContent=names.size;
      $("stats").hidden=$("tbl").hidden=false;$("msg").textContent="";
    }catch(e){$("msg").textContent="الحساب ده مش مسموح له يشوف البيانات ("+e.code+")."}
  });
}
</script>
</body>
</html>
