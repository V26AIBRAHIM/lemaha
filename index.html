<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لمها | lemaha</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎀%3C/text%3E%3C/svg%3E">
<script>
(function(){
  var g=null,t=null;
  try{g=localStorage.getItem("lemaha-gender");t=localStorage.getItem("planner-theme")}catch(e){}
  if(t)document.documentElement.setAttribute("data-theme",t);
  if(location.search.indexOf("change")<0&&(g==="boy"||g==="girl")){
    document.documentElement.style.display="none";
    location.replace(g+".html");
  }
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4fb;--ink:#2b2540;--mut:#6b6485;color-scheme:light;box-sizing:border-box}
:root[data-theme="dark"]{--bg:#16131f;--ink:#f1edfa;--mut:#a79fc2;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
main{width:100%;max-width:440px;text-align:center}
.hi{margin:0;color:var(--mut);font-weight:600}
h1{margin:4px 0 6px;font-size:2rem;font-weight:800}
.sub{margin:0 0 22px;color:var(--mut)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{font:inherit;font-weight:800;font-size:1.35rem;cursor:pointer;border:2px solid;border-radius:24px;padding:22px 8px 18px;transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:none;box-shadow:0 10px 24px rgba(0,0,0,.14)}
.card:active{transform:scale(.97)}
.ic{display:block;font-size:4.4rem;line-height:1.2;margin-bottom:6px}
.boy{background:#dbeafe;border-color:#93c5fd;color:#1e3a8a}
.girl{background:#ffe4ef;border-color:#f9a8d4;color:#9d174d}
:root[data-theme="dark"] .boy{background:#1b2a4a;border-color:#3b64a8;color:#bfdbfe}
:root[data-theme="dark"] .girl{background:#3a1f33;border-color:#a8467e;color:#fbcfe8}
</style>
</head>
<body>
<main>
  <p class="hi">أهلا بيك 👋</p>
  <h1>إنت ولد ولا بنت؟</h1>
  <p class="sub">اختار وهنفتحلك النسخة اللي تناسبك</p>
  <div class="cards">
    <button class="card boy" data-g="boy"><span class="ic">👦</span>ولد</button>
    <button class="card girl" data-g="girl"><span class="ic">👧</span>بنت</button>
  </div>
</main>
<script>
Array.prototype.forEach.call(document.querySelectorAll(".card"),function(b){
  b.onclick=function(){
    var v=b.getAttribute("data-g");
    try{localStorage.setItem("lemaha-gender",v)}catch(e){}
    location.href=v+".html";
  };
});
</script>
</body>
</html>
