<html lang="ar" dir="rtl">

<title>لمها | lemaha</title>

<script>try{var t=localStorage.getItem("planner-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1d2a44;--mut:#66728a;--acc:#2f5d94;--acc-ink:#fff;--bd:#dce2ec;--warn:#c2410c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0f1626;--card:#172033;--ink:#e8ecf5;--mut:#9aa6bf;--acc:#6ea8e6;--acc-ink:#0b1730;--bd:#2a364f;--warn:#fbbf24;color-scheme:dark}
.top{display:flex;margin-bottom:6px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;font-weight:800;margin:8px 0 4px}
h2{font-size:1.15rem;font-weight:800;margin:28px 0 10px}
p.lead{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.9rem;font-weight:600;color:var(--mut);margin-bottom:2px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.full{grid-column:1/-1}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd);padding:4px 10px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--bd);border-inline-start:6px solid var(--c);margin-bottom:8px}
.row b{font-weight:800}.row small{color:var(--mut);display:block}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c)}
.day{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.day h3{margin:0;padding:10px 14px;font-size:1rem;background:var(--bg);border-bottom:1px solid var(--bd)}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-inline-start:6px solid var(--c);border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}.item span{color:var(--mut);font-size:.9rem}
.note{color:var(--warn);font-weight:600;margin:8px 0}
.empty{color:var(--mut);padding:14px;text-align:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
footer{text-align:center;color:var(--mut);font-weight:600;margin-top:36px;padding-top:14px;border-top:1px solid var(--bd)}
.logo{position:relative;border-radius:16px;overflow:hidden;margin:4px 0 16px;border:1px solid var(--bd);box-shadow:0 6px 18px rgba(29,42,68,.12)}
.logo img{display:block;width:100%;height:auto}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,34,64,.88) 0%,rgba(20,34,64,.45) 28%,transparent 52%)}
.logo h1{position:absolute;z-index:1;inset-inline:0;bottom:10px;margin:0;text-align:center;color:#fff;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.logo h1 small{display:block;font-size:.55em;font-weight:600;letter-spacing:.2em;direction:ltr;opacity:.95}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
@media print{.noprint{display:none}body{background:#fff;color:#000}}
/* visitor gate */
#gate{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,34,64,.55);backdrop-filter:blur(4px)}
#gate.on{display:flex}
#gate .box{background:var(--card);color:var(--ink);border:1px solid var(--bd);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#gate h2{margin:0 0 6px}
#gate p{color:var(--mut);font-size:.9rem;margin:0 0 12px}
#gate button{width:100%;margin-top:10px}
</style>
</head>

<p class="lead">ضيف موادك والمتراكم عليك في كل ماده، والجدول بيتوزع لوحده على 7 أيام حسب الأولوية ومعاد الامتحان.</p>

<section class="card noprint">
  <div class="grid">
    <div class="full"><label for="name">اسم المادة</label><input id="name" placeholder="مثلا: هياكل بيانات"></div>
    <div><label for="units">المتراكم عليك (محاضرات / أجزاء)</label><input id="units" type="number" min="1" step="1" value="5"></div>
    <div><label for="per">ساعات المحاضرة الواحدة</label><input id="per" type="number" min="0.5" step="0.5" value="1.5"></div>
    <div><label for="pri">الأولوية</label><select id="pri"><option value="1">عادية</option><option value="2">مهمة</option><option value="3">ضرورية</option></select></div>
    <div><label for="exam">ميعاد الامتحان (اختياري)</label><input id="exam" type="date"></div>
    <div class="full acts" style="margin-top:0"><button id="add">إضافة المادة</button><button class="ghost" id="cancel" hidden>إلغاء التعديل</button></div>
  </div>
</section>

<h2>موادك</h2>
<div id="list"></div>

<h2 class="noprint">إعدادات الأسبوع</h2>
<section class="card grid noprint">
  <div><label for="hours">ساعات المذاكرة في اليوم</label><input id="hours" type="number" min="1" max="14" step="0.5" value="4"></div>
  <div><label for="start">بداية الأسبوع</label><input id="start" type="date"></div>
</section>
<div class="acts noprint"><button id="gen">اعمللي الجدول</button><button class="ghost" id="print">طباعة</button><button class="ghost" id="clear">مسح كل المواد</button></div>

<div id="out"></div>
<footer>Developed by Eng. Abdelrahman</footer>
</main>
<script>
(function(){
var COL=["#2f5d94","#c0392b","#d97706","#0f766e","#7c3aed","#be185d","#4d7c0f","#475569"];
var S={subjects:[],hours:4,start:""};
var ed=-1;
var $=function(id){return document.getElementById(id)};
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function load(){try{var r=localStorage.getItem("planner-v1");if(r){var o=JSON.parse(r);if(o&&o.subjects)S=o}}catch(e){}}
function save(){try{localStorage.setItem("planner-v1",JSON.stringify(S))}catch(e){}}
var PRI=["","عادية","مهمة","ضرورية"];
function fmtDate(s){return new Date(s+"T00:00:00").toLocaleDateString("ar-EG",{day:"numeric",month:"long"})}
function renderList(){
  var el=$("list");
  if(!S.subjects.length){el.innerHTML="";return}
  el.innerHTML=S.subjects.map(function(s,i){
    return '<div class="row" style="--c:'+COL[i%COL.length]+'"><div><b>'+esc(s.name)+'</b><small>'+s.units+' متراكم × '+s.per+' ساعة = '+(s.units*s.per)+' ساعة · '+PRI[s.pri]+(s.exam?' · امتحان '+fmtDate(s.exam):'')+'</small></div><div class="noprint" style="display:flex;gap:6px"><button class="ghost" data-edit="'+i+'">تعديل</button><button class="ghost" data-del="'+i+'">حذف</button></div></div>'
  }).join("")
}
function plan(){
  var n=S.subjects.length,start=new Date(S.start+"T00:00:00"),H=S.hours;
  var lec=S.subjects.map(function(s){return Math.max(1,Math.round(s.units))}),need=lec.slice(),days=[];
  for(var d=0;d<7;d++){
    var date=new Date(start);date.setDate(start.getDate()+d);
    var used=S.subjects.map(function(){return 0}),got=S.subjects.map(function(){return 0}),budget=H,any=false;
    while(true){
      var best=-1,bs=0;
      for(var i=0;i<n;i++){
        var s=S.subjects[i];
        if(lec[i]<=0)continue;
        if(any&&s.per>budget+1e-9)continue;
        var left=null;
        if(s.exam){left=Math.round((new Date(s.exam+"T00:00:00")-date)/864e5);if(left<0)continue}
        var urg=left===null?1:1+Math.max(0,7-left)/3;
        var sc=(lec[i]/need[i])*(1+(s.pri-1)*0.5)*urg/(1+used[i]*1.2);
        if(sc>bs){bs=sc;best=i}
      }
      if(best<0)break;
      var c=S.subjects[best];
      got[best]+=1;used[best]+=c.per;lec[best]-=1;budget-=c.per;any=true;
      if(budget<=1e-9)break
    }
    days.push({date:date,got:got})
  }
  return {days:days,rem:lec,need:need}
}
function hrs(x){
  x=Math.round(x*2)/2;var w=Math.floor(x),hf=x-w>=0.5;
  if(w===0)return "نص ساعة";
  var base=w===1?"ساعة":w===2?"ساعتين":w<=10?w+" ساعات":w+" ساعة";
  return hf?base+" ونص":base
}
function lecs(n){return n===1?"محاضرة":n===2?"محاضرتين":n<=10?n+" محاضرات":n+" محاضرة"}
function generate(){
  S.hours=parseFloat($("hours").value)||4;S.start=$("start").value||iso(new Date());save();
  var out=$("out");
  if(!S.subjects.length){out.innerHTML='<p class="note">ضيف مادة واحدة على الأقل الأول.</p>';return}
  var p=plan(),html='<h2>جدولك</h2>';
  var totL=0,totH=0,leftL=0,leftH=0;
  S.subjects.forEach(function(s,i){totL+=p.need[i];totH+=p.need[i]*s.per;leftL+=p.rem[i];leftH+=p.rem[i]*s.per});
  if(leftL>0)html+='<p class="note">الأسبوع ده مش كفاية لكل المتراكم: فاضل '+lecs(leftL)+' ('+hrs(leftH)+'). زوّد ساعات اليوم أو كمّل الباقي الأسبوع الجاي.</p>';
  else html+='<p class="lead">الجدول ده بيغطي كل المتراكم ('+lecs(totL)+' · '+hrs(totH)+') في الأسبوع. استراحة 10 دقايق كل ساعة.</p>';
  p.days.forEach(function(day){
    var items=[];
    day.got.forEach(function(g,i){if(g>0)items.push({i:i,g:g})});
    items.sort(function(a,b){return b.g-a.g});
    html+='<div class="day"><h3>'+day.date.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})+'</h3>';
    if(!items.length)html+='<div class="empty">استراحه محارب</div>';
    items.forEach(function(it){
      var s=S.subjects[it.i];
      html+='<div class="item" style="--c:'+COL[it.i%COL.length]+'"><b>'+esc(s.name)+'</b><span>'+lecs(it.g)+' · '+hrs(it.g*s.per)+'</span></div>'
    });
    html+='</div>'
  });
  html+='<h2>تغطية كل مادة</h2>';
  S.subjects.forEach(function(s,i){
    var pc=Math.round((p.need[i]-p.rem[i])/p.need[i]*100);
    html+='<div class="row" style="--c:'+COL[i%COL.length]+'"><div style="flex:1"><b>'+esc(s.name)+'</b> <small>'+pc+'% من المتراكم</small><div class="bar"><i style="width:'+pc+'%"></i></div></div></div>'
  });
  out.innerHTML=html;
  out.scrollIntoView({behavior:"smooth"})
}

$("add").onclick=function(){
  var name=$("name").value.trim(),units=Math.round(parseFloat($("units").value)),per=parseFloat($("per").value);
  if(!name||!(units>0)||!(per>0)){$("name").focus();return}
  var obj={name:name,units:units,per:per,pri:parseInt($("pri").value,10),exam:$("exam").value||""};
  if(ed>=0){S.subjects[ed]=obj}else{S.subjects.push(obj)}
  save();resetForm();renderList();$("name").focus()
};
function resetForm(){ed=-1;$("name").value="";$("exam").value="";$("units").value=5;$("per").value=1.5;$("pri").value="1";$("add").textContent="إضافة المادة";$("cancel").hidden=true}
$("cancel").onclick=resetForm;
$("list").onclick=function(e){
  var i=e.target.getAttribute("data-del"),j=e.target.getAttribute("data-edit");
  if(j!==null){var s=S.subjects[parseInt(j,10)];ed=parseInt(j,10);$("name").value=s.name;$("units").value=s.units;$("per").value=s.per;$("pri").value=String(s.pri);$("exam").value=s.exam||"";$("add").textContent="حفظ التعديل";$("cancel").hidden=false;$("name").scrollIntoView({behavior:"smooth",block:"center"});$("name").focus();return}
  if(i!==null){S.subjects.splice(parseInt(i,10),1);if(ed>=0)resetForm();save();renderList()}
};
$("gen").onclick=generate;
$("print").onclick=function(){window.print()};
$("clear").onclick=function(){if(confirm("تمسح كل المواد؟")){S.subjects=[];resetForm();save();renderList();$("out").innerHTML=""}};
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);$("theme").textContent=t==="dark"?"☀️ وضع عادي":"🌙 وضع دارك"}
var th="light";try{th=localStorage.getItem("planner-theme")||"light"}catch(e){}
applyTheme(th);
$("theme").onclick=function(){th=th==="dark"?"light":"dark";applyTheme(th);try{localStorage.setItem("planner-theme",th)}catch(e){}};
$("swap").onclick=function(){location.href="./?change=1"};
load();
$("hours").value=S.hours;$("start").value=S.start||iso(new Date());
renderList();
})();
</script>
